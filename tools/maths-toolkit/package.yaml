# maths-toolkit 市场包元数据（market Tool 类目）

name: maths-toolkit
display_name: Maths Toolkit
category: tool
version: 0.1.4
license: AGPL-3.0-or-later OR Apache-2.0
author: SPHARX Ltd.

description: >-
  Agent 运行时出厂自带的数学计算后端。组合 MCP-Mathematics（数值计算 +
  单位转换 + 金融）与 sympy-mcp（SymPy 符号计算：方程求解、微积分、
  极限、矩阵）能力，运行于共享 Python 虚拟环境。由 maths_d 用户态服务
  经 stdio JSON-RPC 调用。

default_installed: true        # 出厂默认启用（install.sh --with-maths）

install:
  script: install.sh
  options:
    - "--with-einsteinpy  额外安装 einsteinpy（广义相对论，默认跳过以节省空间）"
  shared_venv: true           # 共享 $AIRY_HOME/venv，不创建独立环境

components:
  - type: python_worker
    path: backend/maths_backend.py
    transport: stdio-jsonrpc
  - type: pip_dependencies
    packages: [sympy, mcp-mathematics]
    skip_by_default: [einsteinpy]

capabilities:
  - numerical        # 数值计算（MCP-Mathematics 52 函数 + AST 安全求值）
  - units            # 单位换算（MCP-Mathematics 158 种，15 类量纲）
  - finance          # 金融计算（百分比/税率/利息/贷款/折扣/加价）
  - number_theory    # 数论（素数判定/质因数分解）
  - solve            # 方程/方程组求解
  - differentiate    # 求导
  - integrate        # 定/不定积分
  - limit            # 极限
  - simplify         # 化简
  - factor           # 因式分解
  - expand           # 展开
  - matrix           # 矩阵运算（det/inv/transpose/multiply/eigen）

skill_ref: skills/maths.yaml   # 可选技能指南（指导模型何时使用数学工具）

downgrade: >-
  Python 环境不可用时 maths_d 自动降级到纯 C 快速路径（基础算术/初等函数/
  统计），不阻塞 agentrt 核心运行。
